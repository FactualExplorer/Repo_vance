name: Build playback patches

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check playback regressions
        run: python3 tests/playback/run.py

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Manager-compatible patch bundle
        env:
          ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon --console=plain -Pversion=6.1.0-playback.${{ github.run_number }}

      - name: Upload patch bundle
        uses: actions/upload-artifact@v4
        with:
          name: playback-patches-${{ github.sha }}
          path: patches/build/libs/*.rvp
          if-no-files-found: error
          retention-days: 30
